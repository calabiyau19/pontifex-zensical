<rect x="64" y="152" width="232" height="22" rx="3" fill="#2a3347" stroke="#8a3e00" stroke-width="1"/>
<circle cx="76" cy="163" r="3" fill="#8a3e00"/>
<text x="88" y="167" font-family="monospace" font-size="11" fill="#a05020">+  NEW VM creating...</text>

<rect x="64" y="178" width="232" height="22" rx="3" fill="#1a2236"/>
