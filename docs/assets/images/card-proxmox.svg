<text x="82" y="85" font-family="monospace" font-size="11" fill="#8a3e00">▶</text>
<text x="96" y="85" font-family="monospace" font-size="11" fill="#e8eaf0">nuc5-proxmox</text>

<rect x="64" y="100" width="232" height="22" rx="3" fill="#1a2236"/>
