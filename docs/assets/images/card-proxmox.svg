<text x="88" y="193" font-family="monospace" font-size="11" fill="#e8eaf0">103  openclaw-vm</text>

<text x="180" y="232" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">CPU: 4 cores · RAM: 4GB</text>
