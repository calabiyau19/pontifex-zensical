<text x="500" y="108" text-anchor="middle" font-family="monospace" font-size="13" fill="#e8eaf0">Create VM</text>
<line x1="370" y1="116" x2="630" y2="116" stroke="#2d4a6e" stroke-width="0.5"/>
<text x="378" y="136" font-family="monospace" font-size="11" fill="#8892a4">Name:</text>
<text x="430" y="136" font-family="monospace" font-size="11" fill="#2d9e6b">new-ubuntu-vm</text>
<text x="378" y="154" font-family="monospace" font-size="11" fill="#8892a4">ISO:</text>
<text x="412" y="154" font-family="monospace" font-size="11" fill="#2d9e6b">ubuntu-24.04.iso</text>
<text x="378" y="172" font-family="monospace" font-size="11" fill="#2d9e6b">✓ Ready to create</text>

<rect x="378" y="200" width="244" height="28" rx="4" fill="#8a3e00"/>
<text x="500" y="219" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#e0c8b8">Start VM</text>

<text x="500" y="272" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#a05020">PROXMOX</text>
<text x="500" y="288" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">vm management · upgrades · backups</text>

<line x1="360" y1="30" x2="640" y2="30" stroke="#8a3e00" stroke-width="2"/>
<line x1="640" y1="30" x2="640" y2="310" stroke="#2d4a6e" stroke-width="1"/>
