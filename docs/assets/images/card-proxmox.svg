<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Proxmox category card</title>
<desc>Dark illustrated card for Proxmox category showing datacenter UI and server nodes</desc>

<rect width="680" height="320" fill="#1a1f2e"/>

<rect x="40" y="30" width="280" height="255" rx="8" fill="#1e2535" stroke="#2d4a6e" stroke-width="1"/>
